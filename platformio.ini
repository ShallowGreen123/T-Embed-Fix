; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

;--------------- select you board --------------;

;--------------- select a example --------------;
src_dir = examples/battery_bq27220_sy6970_test ;
; src_dir = examples/cc1101_send_recv_test  ;
; src_dir = examples/nfc_st25r3916_test    ;
; src_dir = examples/ws2812_test            ;
; src_dir = examples/tft_display_test       ;
; src_dir = examples/encoder_key_test       ;
; src_dir = examples/ir_send_recv_test      ;

;----------------------------------------;
boards_dir = boards
; src_dir = examples/${platformio.default_envs}

[env:T_Embed_CC1101]
platform = espressif32@6.13.0
board = T_Embed_PN532
framework = arduino

upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Keep deep dependency scanning, but expose the built-in Arduino bus headers
; explicitly so RadioLib and M5Unit can resolve SPI/Wire transitively.
lib_ldf_mode = deep
; board_build.partitions = default_16MB.csv
; extra_scripts =  ./script/pos_extra_script.py 

build_flags = 
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Wire/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
 
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UARDUINO_USB_CDC_ON_BOOT=0

    -DCORE_DEBUG_LEVEL=3

    -DRADIOLIB_LOW_LEVEL=1

    -DRADIOLIB_STATIC_ONLY=1

    ; -DBOARD_HAS_PSRAM=1
    ; -mfix-esp32-psram-cache-issue

    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; -include lib/lv_conf.h

lib_deps = 
    SPI
    Wire
    ; https://github.com/Seeed-Studio/PN532.git
    ; lewisxhe/XPowersLib@^0.2.3
    ; esphome/ESP32-audioI2S@2.1.0
    ; nrf24/RF24@^1.5.0
    ; lewisxhe/XPowersLib@^0.3.0
    jgromes/RadioLib@^7.7.1
    lewisxhe/XPowersLib@^0.3.3
    lewisxhe/SensorLib@^0.4.1
    adafruit/Adafruit NeoPixel@^1.12.3
    m5stack/M5Unit-NFC@^0.0.3
    m5stack/M5UnitUnified@>=0.4.4
    m5stack/M5Utility@>=0.1.0
    m5stack/M5HAL@>=0.1.0
    crankyoldgit/IRremoteESP8266@^2.8.6
